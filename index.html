<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blitex APKs — a curated catalog of checked, virus-free APKs. Search, tap, download. Updated daily." />
  <title>Blitex APKs</title>
  <!-- Branded pre-JS splash: paints instantly, removed once the app mounts. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #161616;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      transition: opacity 0.35s ease;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    #splash.splash-done {
      opacity: 0;
      pointer-events: none;
    }

    .splash-mark {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eab308;
      border: 3px solid #fff;
      box-shadow: 6px 6px 0 0 #fff;
    }

    .splash-mark b {
      font-weight: 900;
      font-size: 34px;
      color: #161616;
      line-height: 1;
    }

    .splash-bolt {
      position: absolute;
      right: -10px;
      bottom: -10px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4f46e5;
      border: 3px solid #fff;
    }

    .splash-bolt svg {
      width: 12px;
      height: 12px;
      fill: #fff;
    }

    .splash-name {
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #fff;
    }

    .splash-name em {
      font-style: normal;
      color: #eab308;
    }

    .splash-bar {
      width: 180px;
      height: 12px;
      border: 2px solid #fff;
      padding: 2px;
      overflow: hidden;
    }

    .splash-bar i {
      display: block;
      height: 100%;
      width: 40%;
      background: #eab308;
      animation: splash-slide 1s linear infinite;
    }

    @keyframes splash-slide {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(290%);
      }
    }

    .splash-sub {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-bar i {
        animation: none;
        width: 100%;
      }
    }
  </style>
</head>


<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-mark">
      <b>B</b>
      <i class="splash-bolt">
        <svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z" /></svg>
      </i>
    </div>
    <div class="splash-name">Blitex <em>APKs</em></div>
    <div class="splash-bar"><i></i></div>
    <div class="splash-sub">Preparing downloads</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
