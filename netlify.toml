# Blitex APKs — Netlify configuration
# Connect the repo in Netlify and everything below is picked up automatically.
# Only manual step: set the VITE_CONVEX_URL environment variable (see README).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every route renders index.html so /apps, /admin, /auth work
# on hard refresh and direct visits.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived immutable caching for hashed build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "22"
